<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evento Prove</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="gioco.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1b2f; color: #f5f5f5; }
  .screen { display: none; min-height: 100vh; }
  .screen.attivo { display: block; }
  #home { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px; text-align: center; min-height: 100vh; }
  #orologio { font-size: 3.8rem; font-variant-numeric: tabular-nums; font-weight: 700; }
  #data { opacity: .7; text-transform: capitalize; }
  .menu { width: 80%; max-width: 300px; padding: 16px; font-size: 1.1rem; border: none; border-radius: 14px; background: #e94560; color: #fff; cursor: pointer; }
  .consenso { font-size: .95rem; opacity: .85; }
  .barra { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #16213e; }
  .indietro { background: none; border: none; color: #fff; font-size: 1rem; cursor: pointer; }
  #mappa { height: 65vh; width: 100%; }
  #posizione { padding: 12px 16px; font-size: .95rem; line-height: 1.4; }
  .prova { background: #16213e; margin: 10px 16px; padding: 14px; border-radius: 12px; }
  .prova small { opacity: .7; }
  .leaflet-popup-content { font-size: .95rem; color: #222; }
</style>
</head>
<body>

<div id="home" class="screen attivo">
  <div id="orologio">--:--:--</div>
  <div id="data"></div>
  <div id="tempoGioco" style="font-size:1.4rem; opacity:.9;"></div>
  <button class="menu" onclick="vai('mappa')">🗺️ Mappa</button>
  <button class="menu" onclick="vai('elenco')">📋 Elenco prove</button>
  <label class="consenso">
    <input type="checkbox" id="condividi" onchange="gestisciConsenso()">
    Condividi la mia posizione con l'organizzatore
  </label>
</div>

<div id="mappaSchermo" class="screen">
  <div class="barra"><button class="indietro" onclick="vai('home')">← Indietro</button><b>Mappa</b><span></span></div>
  <div id="mappa"></div>
  <div id="posizione">📍 Attiva la geolocalizzazione per vedere dove sei.</div>
</div>

<div id="elencoSchermo" class="screen">
  <div class="barra"><button class="indietro" onclick="vai('home')">← Indietro</button><b>Prove</b><span></span></div>
  <div id="lista"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="prove.js"></script>
<script>
// ---------- Orologio ----------
function aggiornaOrologio() {
  const o = new Date();
  document.getElementById('orologio').textContent =
    o.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('data').textContent =
    o.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(aggiornaOrologio, 1000);
aggiornaOrologio();

// ---------- Navigazione ----------
function vai(schermo) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('attivo'));
  const id = { home: 'home', mappa: 'mappaSchermo', elenco: 'elencoSchermo' }[schermo];
  document.getElementById(id).classList.add('attivo');
  if (schermo === 'mappa') setTimeout(() => mappaLeaflet.invalidateSize(), 150);
}

// ---------- Elenco prove ----------
const ICONE = { fortuna: '🍀', mondo: '🌍', animali: '🐾' };
const icona = tipo => ICONE[tipo] || '⭐';

document.getElementById('lista').innerHTML = PROVE.map(p => `
  <div class="prova">
    <b>${icona(p.tipo)} ${p.nome}</b><br>
    <small>🕒 ${p.orario}</small>
    <p>${p.descrizione}</p>
  </div>`).join('');

// ---------- Firebase ----------
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
let uid = null;
firebase.auth().onAuthStateChanged(u => { if (u) uid = u.uid; });
firebase.auth().signInAnonymously().catch(e => console.error('Login anonimo fallito', e));

// ---------- Orologio di gioco ----------
// Il listener parte solo dopo il login anonimo, altrimenti le regole lo bloccano
let statoGioco = null, ascoltaGioco = false;
firebase.auth().onAuthStateChanged(u => {
  if (!u || ascoltaGioco) return;
  ascoltaGioco = true;
  db.collection('config').doc('evento').onSnapshot(doc => {
    statoGioco = doc.data() || null;
  }, err => console.error('Lettura orologio fallita', err));
});

setInterval(() => {
  document.getElementById('tempoGioco').textContent = statoGioco
    ? '🎭 Ora di gioco: ' + formatoGioco(tempoGioco(statoGioco))
    : '🎭 Ora di gioco: non ancora avviata';
}, 1000);

// ---------- Mappa limitata a Luvinate ----------
const bounds = L.latLngBounds([ZONA.latMin, ZONA.lngMin], [ZONA.latMax, ZONA.lngMax]);
const mappaLeaflet = L.map('mappa', {
  minZoom: ZONA.zoom - 1,
  maxZoom: 18,
  maxBounds: bounds.pad(0.2),
  maxBoundsViscosity: 1.0
}).setView(ZONA.centro, ZONA.zoom);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(mappaLeaflet);

PROVE.forEach(p => {
  L.marker([p.lat, p.lng]).addTo(mappaLeaflet).bindPopup(
    `<b>${icona(p.tipo)} ${p.nome}</b><br>🕒 ${p.orario}<br>${p.descrizione}`
  );
});

// ---------- Distanza (formula di Haversine, risultato in metri) ----------
function distanza(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let markerMio = null, ultimoInvio = 0;
const testoPosizione = document.getElementById('posizione');

navigator.geolocation.watchPosition(pos => {
  const { latitude: lat, longitude: lng } = pos.coords;

  if (!markerMio) {
    markerMio = L.circleMarker([lat, lng], { radius: 9, color: '#fff', fillColor: '#1e90ff', fillOpacity: 1 }).addTo(mappaLeaflet);
  } else {
    markerMio.setLatLng([lat, lng]);
  }

  const dentro = lat >= ZONA.latMin && lat <= ZONA.latMax && lng >= ZONA.lngMin && lng <= ZONA.lngMax;
  if (dentro) {
    let vicina = null, min = Infinity;
    PROVE.forEach(p => {
      const d = distanza(lat, lng, p.lat, p.lng);
      if (d < min) { min = d; vicina = p; }
    });
    testoPosizione.innerHTML = `📍 Ti trovi a Luvinate. Prova più vicina: <b>${vicina.nome}</b> (${Math.round(min)} m)`;
  } else {
    testoPosizione.textContent = "📍 Sei fuori dalla zona dell'evento.";
  }

  // Invia la posizione all'organizzatore solo se il partecipante ha dato il consenso
  if (document.getElementById('condividi').checked && uid && dentro && Date.now() - ultimoInvio > 30000) {
    ultimoInvio =
