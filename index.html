<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<title>Evento Prove</title>
<link rel="manifest" href="manifest.json">
<!-- Import del font Merriweather -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<script src="gioco.js"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Merriweather', serif; 
    background: #0a0f1d; 
    color: #f5f5f5; 
  }
  #home { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 20px; 
    padding: 20px; 
    text-align: center; 
    min-height: 100vh; 
  }
  #orologio { 
    font-size: 3.5rem; 
    font-variant-numeric: tabular-nums; 
    font-weight: 700; 
    letter-spacing: -1px;
  }
  #data { 
    opacity: .75; 
    text-transform: capitalize; 
    font-size: 1.05rem;
  }
  #tempoGioco {
    font-size: 1.2rem; 
    opacity: .9;
    background: rgba(0, 255, 136, 0.1);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(0, 255, 136, 0.3);
  }
  .menu { 
    width: 80%; 
    max-width: 300px; 
    padding: 16px; 
    font-size: 1.15rem; 
    font-family: 'Merriweather', serif;
    font-weight: 700;
    border: none; 
    border-radius: 14px; 
    background: #00ff88; 
    color: #0a0f1d; 
    cursor: pointer; 
    box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
  }
  .btn-google {
    background: #fff;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .consenso { 
    font-size: 0.9rem; 
    opacity: .85; 
    margin-top: 5px;
  }
  #statoUtente {
    font-size: 0.9rem;
    color: #00ff88;
    margin-bottom: -10px;
  }
</style>
</head>
<body>

<div id="home">
  <div id="orologio">--:--:--</div>
  <div id="data"></div>
  <div id="tempoGioco">🎭 Ora di gioco: in caricamento...</div>
  
  <div id="statoUtente">Accesso richiesto per partecipare</div>
  <button class="menu btn-google" id="btnAccedi" onclick="accediGoogle()">🔵 Accedi con Google</button>
  
  <button class="menu" onclick="window.location.href='mappa.html'">🗺️ Mappa</button>
  <button class="menu" onclick="window.location.href='prove.html'">📋 Elenco prove</button>
  
  <label class="consenso" id="boxConsenso" style="display:none;">
    <input type="checkbox" id="condividi" onchange="gestisciConsenso()">
    Condividi la mia posizione con l'organizzatore
  </label>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
let utenteCorrente = null;
let statoGioco = null;

// ---------- Autenticazione Google per partecipanti ----------
function accediGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => console.error("Errore login Google:", e));
}

auth.onAuthStateChanged(u => {
  utenteCorrente = u;
  const btn = document.getElementById('btnAccedi');
  const stato = document.getElementById('statoUtente');
  const box = document.getElementById('boxConsenso');

  if (u) {
    btn.style.display = 'none';
    stato.textContent = `👤 Benvenuto, ${u.displayName || u.email}`;
    box.style.display = 'block';
    
    // Salva il nome nel localStorage per usarlo nella mappa
    localStorage.setItem('nomePartecipante', u.displayName || u.email);
  } else {
    btn.style.display = 'block';
    stato.textContent = "Effettua l'accesso per partecipare al gioco";
    box.style.display = 'none';
    localStorage.removeItem('nomePartecipante');
  }
});

// ---------- Orologio Reale ----------
function aggiornaOrologio() {
  const o = new Date();
  document.getElementById('orologio').textContent =
    o.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('data').textContent =
    o.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(aggiornaOrologio, 1000);
aggiornaOrologio();

// ---------- Orologio di Gioco ----------
db.collection('config').doc('evento').onSnapshot(doc => {
  statoGioco = doc.data() || null;
}, err => console.error('Lettura orologio fallita', err));

setInterval(() => {
  document.getElementById('tempoGioco').textContent = statoGioco
    ? '🎭 Ora di gioco: ' + formatoGioco(tempoGioco(statoGioco))
    : '🎭 Ora di gioco: non ancora avviata';
}, 1000);

// ---------- Gestione Consenso e Posizione ----------
function gestisciConsenso() {
  const attivo = document.getElementById('condividi').checked;
  if (!attivo && utenteCorrente) {
    db.collection('posizioni').doc(utenteCorrente.uid).delete().catch(() => {});
  }
}
</script>
</body>
</html>
