<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<title>Evento Prove</title>
<link rel="manifest" href="manifest.json">
<!-- Import del font Merriweather -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<script src="gioco.js"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Merriweather', serif; 
    background: radial-gradient(circle at 50% 20%, rgba(0, 255, 136, 0.12) 0%, rgba(10, 15, 29, 1) 70%), #0a0f1d; 
    color: #f5f5f5; 
    min-height: 100vh;
  }
  #home { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 20px; 
    padding: 20px; 
    text-align: center; 
    min-height: 100vh; 
  }
  #orologioGioco { 
    font-size: 3.8rem; 
    font-variant-numeric: tabular-nums; 
    font-weight: 700; 
    color: #00ff88;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    letter-spacing: -1px;
    margin: 10px 0;
  }
  #dataReale { 
    opacity: .75; 
    text-transform: capitalize; 
    font-size: 0.95rem;
  }
  .menu { 
    width: 80%; 
    max-width: 300px; 
    padding: 16px; 
    font-size: 1.15rem; 
    font-family: 'Merriweather', serif;
    font-weight: 700;
    border: none; 
    border-radius: 14px; 
    background: #00ff88; 
    color: #0a0f1d; 
    cursor: pointer; 
    box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
    transition: transform 0.1s ease;
  }
  .menu:active { transform: scale(0.97); }
  .btn-google {
    background: #fff;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .consenso { 
    font-size: 0.9rem; 
    opacity: .85; 
    margin-top: 10px;
    cursor: pointer;
  }
  #statoUtente {
    font-size: 0.95rem;
    color: #00ff88;
    margin-bottom: 5px;
  }
  #contenutoProtetto {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  #sezioneLogin {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    background: rgba(17, 24, 39, 0.7);
    padding: 30px 20px;
    border-radius: 20px;
    border: 1px solid rgba(0, 255, 136, 0.2);
    max-width: 340px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

<div id="home">
  
  <!-- SCHERMATA DI LOGIN OBBLIGATORIO -->
  <div id="sezioneLogin">
    <h2 style="margin: 0 0 10px 0; font-size: 1.4rem;">Evento Prove</h2>
    <p style="font-size: 0.9rem; opacity: 0.8; margin: 0 0 15px 0;">Accedi con Google per entrare nel gioco</p>
    <button class="menu btn-google" onclick="accediGoogle()">🔵 Accedi con Google</button>
  </div>

  <!-- CONTENUTO PRINCIPALE DEL GIOCO -->
  <div id="contenutoProtetto">
    <div id="statoUtente"></div>
    
    <div>
      <div style="font-size: 0.9rem; opacity: 0.8; margin-bottom: -5px;">⏰ Ora di gioco (x2)</div>
      <div id="orologioGioco">00:00:00</div>
      <div id="dataReale"></div>
    </div>
    
    <button class="menu" onclick="window.location.href='mappa.html'">🗺️ Mappa</button>
    <button class="menu" onclick="window.location.href='prove.html'">📋 Elenco prove</button>
    
    <label class="consenso">
      <input type="checkbox" id="condividi" onchange="gestisciConsenso()">
      Condividi la mia posizione con l'organizzatore
    </label>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
let utenteCorrente = null;
let statoGioco = null;

// Gestione del ritorno dal reindirizzamento di Google
auth.getRedirectResult().catch(e => console.error("Errore redirect Google:", e));

// Login con Reindirizzamento (perfetto per mobile)
function accediGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider)
    .then(() => {
      console.log("Reindirizzamento a Google avviato...");
    })
    .catch(error => {
      console.error("Errore critico Google Sign-In:", error.code, error.message);
      alert("Errore di accesso: " + error.message);
    });
}

auth.onAuthStateChanged(u => {
  utenteCorrente = u;
  const sezioneLogin = document.getElementById('sezioneLogin');
  const contenutoProtetto = document.getElementById('contenutoProtetto');
  const statoUtente = document.getElementById('statoUtente');

  if (u) {
    sezioneLogin.style.display = 'none';
    contenutoProtetto.style.display = 'flex';
    statoUtente.textContent = `👤 Benvenuto, ${u.displayName || u.email}`;
    localStorage.setItem('nomePartecipante', u.displayName || u.email);
    
    if (localStorage.getItem('consensoPosizione') === 'true') {
      document.getElementById('condividi').checked = true;
    }
  } else {
    sezioneLogin.style.display = 'flex';
    contenutoProtetto.style.display = 'none';
    localStorage.removeItem('nomePartecipante');
  }
});

function aggiornaDataReale() {
  const o = new Date();
  document.getElementById('dataReale').textContent =
    o.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
}
aggiornaDataReale();

db.collection('config').doc('evento').onSnapshot(doc => {
  statoGioco = doc.data() || null;
}, err => console.error('Lettura orologio fallita', err));

setInterval(() => {
  if (statoGioco) {
    document.getElementById('orologioGioco').textContent = formatoGioco(tempoGioco(statoGioco));
  } else {
    document.getElementById('orologioGioco').textContent = "00:00:00";
  }
}, 1000);

function gestisciConsenso() {
  const attivo = document.getElementById('condividi').checked;
  if (attivo) {
    localStorage.setItem('consensoPosizione', 'true');
  } else {
    localStorage.removeItem('consensoPosizione');
    if (utenteCorrente) {
      db.collection('posizioni').doc(utenteCorrente.uid).delete().catch(() => {});
    }
  }
}
</script>
</body>
</html>
