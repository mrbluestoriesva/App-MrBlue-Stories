<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<title>Mappa - Evento Prove</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Merriweather', serif; background: #0a0f1d; color: #f5f5f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .barra { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #111827; border-bottom: 1px solid rgba(0, 255, 136, 0.2); }
  .indietro { background: none; border: none; color: #00ff88; font-family: 'Merriweather', serif; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .barra b { font-size: 1.1rem; }
  #mappa { flex-grow: 1; width: 100%; }
  #posizione { padding: 14px 18px; font-size: 0.9rem; line-height: 1.4; background: #111827; border-top: 1px solid rgba(0, 255, 136, 0.2); text-align: center; }
</style>
</head>
<body>

<div class="barra">
  <button class="indietro" onclick="window.location.href='index.html'">← Indietro</button>
  <b>Mappa dell'Evento</b>
  <span></span>
</div>

<div id="mappa"></div>
<div id="posizione">📍 Attiva la geolocalizzazione per vedere dove sei.</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="prove.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
let utenteCorrente = null;

auth.onAuthStateChanged(u => { utenteCorrente = u; });

// Mappa Leaflet
const ICONE = { fortuna: '🍀', mondo: '🌍', animali: '🐾' };
const icona = tipo => ICONE[tipo] || '⭐';

const bounds = L.latLngBounds([ZONA.latMin, ZONA.lngMin], [ZONA.latMax, ZONA.lngMax]);
const mappaLeaflet = L.map('mappa', {
  minZoom: ZONA.zoom - 1, maxZoom: 18,
  maxBounds: bounds.pad(0.2), maxBoundsViscosity: 1.0
}).setView(ZONA.centro, ZONA.zoom);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(mappaLeaflet);

PROVE.forEach(p => {
  L.marker([p.lat, p.lng]).addTo(mappaLeaflet).bindPopup(
    `<b>${icona(p.tipo)} ${p.nome}</b><br>🕒 ${p.orario}<br>${p.descrizione}`
  );
});

function distanza(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

let markerMio = null, ultimoInvio = 0;
const testoPosizione = document.getElementById('posizione');

navigator.geolocation.watchPosition(pos => {
  const { latitude: lat, longitude: lng } = pos.coords;

  if (!markerMio) {
    markerMio = L.circleMarker([lat, lng], { radius: 9, color: '#0a0f1d', fillColor: '#00ff88', fillOpacity: 1 }).addTo(mappaLeaflet);
  } else {
    markerMio.setLatLng([lat, lng]);
  }

  const dentro = lat >= ZONA.latMin && lat <= ZONA.latMax && lng >= ZONA.lngMin && lng <= ZONA.lngMax;
  if (dentro) {
    let vicina = null, min = Infinity;
    PROVE.forEach(p => {
      const d = distanza(lat, lng, p.lat, p.lng);
      if (d < min) { min = d; vicina = p; }
    });
    testoPosizione.innerHTML = `📍 Ti trovi a Luvinate. Prova più vicina: <b>${vicina.nome}</b> (${Math.round(min)} m)`;
  } else {
    testoPosizione.textContent = "📍 Sei fuori dalla zona dell'evento.";
  }

  // Invia posizione se loggato e consenso attivo
  const condividiAttivo = localStorage.getItem('nomePartecipante');
  if (condividiAttivo && utenteCorrente && dentro && Date.now() - ultimoInvio > 30000) {
    ultimoInvio = Date.now();
    db.collection('posizioni').doc(utenteCorrente.uid).set({
      lat, lng,
      nome: utenteCorrente.displayName || utenteCorrente.email,
      aggiornato: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => console.error('Invio posizione fallito', e));
  }
}, () => {
  testoPosizione.textContent = 'Attiva la geolocalizzazione per vedere dove sei.';
}, { enableHighAccuracy: true });
</script>
</body>
</html>
