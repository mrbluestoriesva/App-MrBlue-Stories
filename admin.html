<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Organizzatore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="gioco.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0f1d; color: #f5f5f5; }
  .schermata { display: none; }
  .schermata.attiva { display: block; }
  #schermataLogin.attiva { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }

  .card { background: rgba(17,24,39,0.95); border: 1px solid rgba(0,255,136,0.3); border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0 0 4px; color: #00ff88; }
  .input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0,255,136,0.3); background: #0a0f1d; color: #fff; font-size: 1rem; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00ff88; color: #0a0f1d; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn-rosso { background: none; color: #ff4d4d; border: 1px solid #ff4d4d; }
  .errore { color: #ff4d4d; font-size: 0.9rem; min-height: 1em; margin: 0; }

  #controlli { padding: 16px; background: #111827; border-bottom: 1px solid rgba(0,255,136,0.2); }
  #statoGioco { font-weight: bold; color: #00ff88; margin: 0 0 10px; }
  #controlli button { padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 0.95rem; background: #00ff88; color: #0a0f1d; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  #controlli button.secondario { background: #374151; color: #fff; }
  #mappaAdmin { height: 50vh; width: 100%; }
  #listaUtenti { padding: 16px; background: #111827; max-height: 30vh; overflow-y: auto; }
  .utente-card { background: #1f2937; padding: 10px 14px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #00ff88; font-size: 0.9rem; }

  /* Trasforma la mappa in modalità scura */
  .leaflet-tile-pane {
    filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
  }
</style>
</head>
<body>

<!-- LOGIN ORGANIZZATORE -->
<div id="schermataLogin" class="schermata attiva">
  <div class="card">
    <h2>Area Organizzatore</h2>
    <input type="email" id="email" class="input" placeholder="Email">
    <input type="password" id="password" class="input" placeholder="Password">
    <button type="button" class="btn" onclick="accedi()">Accedi</button>
    <p id="errore" class="errore"></p>
  </div>
</div>

<!-- AREA ADMIN -->
<div id="schermataAdmin" class="schermata">
  <div id="controlli">
    <p id="statoGioco">Orologio di gioco non avviato</p>
    <button type="button" onclick="avviaGioco()">▶ Avvia (riprende da dove è fermo)</button>
    <button type="button" class="secondario" onclick="fermaGioco()">⏸ Ferma</button>
    <button type="button" class="secondario" onclick="resetGioco19()">⏮ Imposta alle 19:00</button>
  </div>
  <div id="mappaAdmin"></div>
  <div id="listaUtenti">
    <h3 style="margin-top:0">👥 Partecipanti online</h3>
    <div id="contenutoLista">Nessun partecipante online al momento.</div>
  </div>
  <div style="padding:16px;">
    <button type="button" class="btn btn-rosso" onclick="esci()">Esci dall'area admin</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="prove.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const refGioco = db.collection('config').doc('evento');

let mappaAdmin = null, gruppo = null;
let unsubPosizioni = null, unsubGioco = null;
let statoGioco = null;

// ---------- Utilità ----------
function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function mostra(id) {
  document.querySelectorAll('.schermata').forEach(s => s.classList.remove('attiva'));
  const el = document.getElementById(id);
  if (el) el.classList.add('attiva');
}

// ---------- Login ----------
function accedi() {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const err = document.getElementById('errore');

  if (!emailInput || !passwordInput || !err) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  err.textContent = 'Verifica credenziali in corso...';

  if (!email || !password) {
    err.textContent = 'Inserisci sia email che password.';
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      err.textContent = '';
    })
    .catch(e => {
      console.error("Errore Login Firebase:", e);
      const traduzioni = {
        'auth/invalid-credential': 'Email o password non corrette.',
        'auth/user-not-found': 'Utente non trovato nel database Firebase.',
        'auth/wrong-password': 'Password errata.',
        'auth/invalid-email': 'Formato email non valido.',
        'auth/too-many-requests': 'Troppi tentativi falliti: attendi un paio di minuti.',
        'auth/network-request-failed': 'Errore di connessione a Internet.'
      };
      err.textContent = traduzioni[e.code] || ('Errore (' + e.code + '): ' + e.message);
    });
}

function esci() { auth.signOut(); }

auth.onAuthStateChanged(u => {
  const err = document.getElementById('errore');

  if (u && typeof ADMIN_EMAIL !== 'undefined' && u.email === ADMIN_EMAIL) {
    mostra('schermataAdmin');
    avviaMappaAdmin();
    avviaOrologio();
    avviaPosizioni();
    setTimeout(() => { if (mappaAdmin) mappaAdmin.invalidateSize(); }, 150);
    return;
  }

  if (u) {
    const adminAttesa = typeof ADMIN_EMAIL !== 'undefined' ? ADMIN_EMAIL : 'SCONOSCIUTA (config.js non caricato)';
    if (err) err.textContent = `Account non autorizzato: "${u.email}" non corrisponde ad ADMIN_EMAIL (${adminAttesa}).`;
    auth.signOut();
    return;
  }

  mostra('schermataLogin');
  if (unsubPosizioni) { unsubPosizioni(); unsubPosizioni = null; }
  if (unsubGioco) { unsubGioco(); unsubGioco = null; }
  statoGioco = null;
});

// ---------- Mappa ----------
function avviaMappaAdmin() {
  if (mappaAdmin) return;
  mappaAdmin = L.map('mappaAdmin').setView(ZONA.centro, ZONA.zoom);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(mappaAdmin);

  PROVE.forEach(p => {
    L.circle([p.lat, p.lng], {
      radius: 10,
      color: '#00ff88',
      weight: 2,
      fillColor: '#00ff88',
      fillOpacity: 0.35
    }).addTo(mappaAdmin).bindPopup(escapeHtml(p.nome));
  });

  gruppo = L.layerGroup().addTo(mappaAdmin);
}

// ---------- Posizioni partecipanti ----------
function avviaPosizioni() {
  if (unsubPosizioni) return;
  unsubPosizioni = db.collection('posizioni').onSnapshot(snap => {
    if (gruppo) gruppo.clearLayers();
    const cont = document.getElementById('contenutoLista');

    if (snap.empty) {
      if (cont) cont.textContent = 'Nessun partecipante online al momento.';
      return;
    }

    let html = '';
    snap.forEach(doc => {
      const d = doc.data();
      const nome = escapeHtml(d.nome || 'Partecipante');
      const ora = d.aggiornato && d.aggiornato.toDate
        ? d.aggiornato.toDate().toLocaleTimeString('it-IT') : '—';

      if (gruppo) {
        L.circleMarker([d.lat, d.lng], { radius: 9, color: '#0a0f1d', fillColor: '#00ff88', fillOpacity: 1 })
          .bindPopup(`<b>${nome}</b><br>Aggiornato: ${ora}`)
          .addTo(gruppo);
      }

      html += `
        <div class="utente-card">
          <b>👤 ${nome}</b><br>
          📍 Lat: ${d.lat ? d.lat.toFixed(4) : '—'}, Lng: ${d.lng ? d.lng.toFixed(4) : '—'}<br>
          🕒 Ultimo aggiornamento: ${ora}
        </div>`;
    });
    if (cont) cont.innerHTML = html;
  }, err => console.error('Lettura posizioni fallita', err));
}

// ---------- Orologio di gioco ----------
function avviaOrologio() {
  if (unsubGioco) return;
  unsubGioco = refGioco.onSnapshot(doc => {
    statoGioco = doc.data() || null;
  }, err => console.error('Lettura orologio fallita', err));
}

setInterval(() => {
  const adminScreen = document.getElementById('schermataAdmin');
  const statoEl = document.getElementById('statoGioco');
  if (!adminScreen || !adminScreen.classList.contains('attiva') || !statoEl) return;

  if (!statoGioco) {
    statoEl.textContent = 'Orologio di gioco non avviato';
    return;
  }

  const orarioFormattato = typeof formatoGioco === 'function' && typeof tempoGioco === 'function'
    ? formatoGioco(tempoGioco(statoGioco))
    : '19:00:00';

  statoEl.textContent = (statoGioco.attivo ? '🟢 In corso (x2)' : '⏸ Fermo') + ' · Ora di gioco: ' + orarioFormattato;
}, 1000);

const MS_19_00 = 19 * 60 * 60 * 1000;

function avviaGioco() {
  let tempoCorrente = (statoGioco && typeof tempoGioco === 'function') ? tempoGioco(statoGioco) : MS_19_00;
  if (!tempoCorrente || tempoCorrente === 0) tempoCorrente = MS_19_00;

  refGioco.set({ attivo: true, gioco0: tempoCorrente, reale0: Date.now() });
}

function fermaGioco() {
  let tempoCorrente = (statoGioco && typeof tempoGioco === 'function') ? tempoGioco(statoGioco) : MS_19_00;
  refGioco.set({ attivo: false, gioco0: tempoCorrente, reale0: Date.now() });
}

function resetGioco19() {
  refGioco.set({ attivo: false, gioco0: MS_19_00, reale0: Date.now() });
}
</script>
</body>
</html>
