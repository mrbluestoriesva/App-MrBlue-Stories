<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area organizzatore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="gioco.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #schermataLogin { padding: 20px; max-width: 340px; margin: 40px auto; }
  #schermataLogin input, #schermataLogin button, #esci { width: 100%; padding: 12px; margin: 6px 0; font-size: 1rem; box-sizing: border-box; }
  #schermataAdmin { display: none; }
  #controlliGioco { padding: 12px; }
  #controlliGioco button { padding: 10px 14px; margin: 4px 4px 4px 0; font-size: 1rem; }
  #mappaAdmin { height: 60vh; width: 100%; }
  #lista { padding: 12px; font-size: .95rem; }
  #errore { color: #c00; }
</style>
</head>
<body>

<div id="schermataLogin">
  <h2>Area organizzatore</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="accedi()">Accedi</button>
  <p id="errore"></p>
</div>

<div id="schermataAdmin">
  <div id="controlliGioco">
    <p id="statoGioco">Orologio di gioco non ancora avviato</p>
    <button onclick="avviaGioco()">▶ Avvia (x2)</button>
    <button onclick="fermaGioco()">⏸ Ferma</button>
    <button onclick="resetGioco()">⏮ Reset a mezzanotte</button>
  </div>
  <div id="mappaAdmin"></div>
  <div id="lista"></div>
  <button id="esci" onclick="esci()">Esci</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="prove.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
let mappaAdmin = null, gruppo = null, unsub = null, unsubGioco = null;

// ---------- Orologio di gioco ----------
const refGioco = db.collection('config').doc('evento');
let statoGioco = null;

function avviaOrologioGioco() {
  if (unsubGioco) return;
  unsubGioco = refGioco.onSnapshot(doc => {
    statoGioco = doc.data() || null;
  }, err => console.error('Lettura orologio fallita', err));
}

function fermaOrologioGioco() {
  if (unsubGioco) { unsubGioco(); unsubGioco = null; }
  statoGioco = null;
}

setInterval(() => {
  if (!statoGioco) return;
  document.getElementById('statoGioco').textContent =
    (statoGioco.attivo ? 'In corso' : 'Fermo') +
    ' · ora di gioco ' + formatoGioco(tempoGioco(statoGioco));
}, 1000);

function avviaGioco() {
  refGioco.set({ attivo: true, gioco0: tempoGioco(statoGioco), reale0: Date.now() });
}
function fermaGioco() {
  refGioco.set({ attivo: false, gioco0: tempoGioco(statoGioco), reale0: Date.now() });
}
function resetGioco() {
  refGioco.set({ attivo: false, gioco0: 0, reale0: Date.now() });
}

// ---------- Login e area admin ----------
function accedi() {
  auth.signInWithEmailAndPassword(
    document.getElementById('email').value,
    document.getElementById('password').value
  ).catch(() => {
    document.getElementById('errore').textContent = 'Accesso negato.';
  });
}

function esci() { auth.signOut(); }

auth.onAuthStateChanged(u => {
  if (u && u.email === ADMIN_EMAIL) {
    document.getElementById('schermataLogin').style.display = 'none';
    document.getElementById('schermataAdmin').style.display = 'block';
    avvia();
    avviaOrologioGioco();
  } else {
    document.getElementById('schermataLogin').style.display = 'block';
    document.getElementById('schermataAdmin').style.display = 'none';
    if (unsub) { unsub(); unsub = null; }
    fermaOrologioGioco();
  }
});

function avvia() {
  if (!mappaAdmin) {
    mappaAdmin = L.map('mappaAdmin').setView(ZONA.centro, ZONA.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(mappaAdmin);
    PROVE.forEach(p => L.marker([p.lat, p.lng]).addTo(mappaAdmin).bindPopup(p.nome));
    gruppo = L.layerGroup().addTo(mappaAdmin);
  }

  if (unsub) return;
  unsub = db.collection('posizioni').onSnapshot(snap => {
    gruppo.clearLayers();
    let html = '';
    snap.forEach(doc => {
      const d = doc.data();
      const ora = d.aggiornato && d.aggiornato.toDate
        ? d.aggiornato.toDate().toLocaleTimeString('it-IT') : '—';
      L.circleMarker([d.lat, d.lng], { radius: 8, color: '#fff', fillColor: '#e94560', fillOpacity: 1 })
        .bindPopup(`<b>${d.nome}</b><br>${ora}`)
        .addTo(gruppo);
      html += `<p><b>${d.nome}</b> — ultimo aggiornamento ${ora}</p>`;
    });
    document.getElementById('lista').innerHTML = html || 'Nessuna posizione condivisa al momento.';
  }, err => console.error(err));
}
</script>
</body>
</html>
